name: "CodeQL"

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  schedule:
    # Mondays at 06:27 UTC — off the hour to avoid scheduler contention.
    - cron: "27 6 * * 1"

jobs:
  analyze:
    name: Analyze (${{ matrix.language }})
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      security-events: write

    strategy:
      fail-fast: false
      matrix:
        # The "javascript-typescript" language covers both .js and .jsx
        # across all three apps + the dashboard proxy server.
        language: ["javascript-typescript"]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v4.37.4
        with:
          languages: ${{ matrix.language }}
          # security-and-quality bundles the standard security queries
          # plus code-quality checks. Slightly noisier than security-extended
          # but a better fit for a learning project.
          queries: security-and-quality

      - name: Autobuild
        uses: github/codeql-action/autobuild@v4.37.4

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v4.37.4
        with:
          category: "/language:${{ matrix.language }}"
